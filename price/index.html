<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<title>Конструктор прайс-листа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marck+Script&family=Montserrat:wght@400;500;600&display=swap">
<style>
  /* Форма слева, живое превью картинки справа; на телефоне — друг под другом. */
  :root {
    --bg: #f7f3ee; --panel: #ffffff; --line: #e6dcd0; --field: #fffdfa;
    --text: #2b2420; --muted: #8a7b6e; --accent: #9b6b4f; --accent-ink: #ffffff; --bad: #b8483a; --ok: #4f7f45;
    --ui: "Montserrat", "Segoe UI", system-ui, sans-serif;
    --display: "Cormorant Garamond", "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16120f; --panel: #1f1a16; --line: #3a3029; --field: #1a1613;
      --text: #eee5da; --muted: #a8988a; --accent: #d2a37f; --accent-ink: #1a120c; --bad: #e08a6a; --ok: #8fbf7a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 15px;
    padding: calc(22px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; }
  header p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 36px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  section.group { display: flex; flex-direction: column; gap: 12px; }
  section.group + section.group { border-top: 1px solid var(--line); padding-top: 20px; }
  h2 { margin: 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label, .lbl { font-size: 12px; color: var(--muted); }
  .req::after { content: " *"; color: var(--bad); }
  input[type="text"], input[type="tel"], input[type="url"], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 0;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  .themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .theme { border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font: inherit; color: var(--text); font-size: 12.5px; }
  .theme i { display: block; height: 46px; border-radius: 6px; }
  .theme[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: var(--field); color: var(--text); font: inherit; font-size: 13.5px; padding: 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .svcs { display: flex; flex-direction: column; gap: 8px; }
  .svc { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 6px; align-items: center; }
  .svc .tools { display: flex; gap: 2px; }
  .icon { border: 1px solid transparent; background: none; color: var(--muted); font: inherit; font-size: 16px; width: 32px; height: 40px; border-radius: 8px; cursor: pointer; padding: 0; }
  .icon:hover { color: var(--text); border-color: var(--line); }
  .icon:disabled { opacity: .3; cursor: default; }
  .empty { font-size: 13.5px; color: var(--muted); padding: 6px 0; }
  .add { display: flex; flex-direction: column; gap: 8px; }
  .btn { font: inherit; font-size: 14px; cursor: pointer; border-radius: 10px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .btnrow .btn { flex: 1 1 140px; }

  .soc { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; align-items: center; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .status { min-height: 1.3em; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--ok); }

  .preview { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
  .preview canvas { width: 100%; max-width: 460px; height: auto; border-radius: 8px; box-shadow: 0 18px 50px rgba(40, 25, 15, .25); background: #ddd; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .preview { position: static; order: -1; } .preview canvas { max-width: 320px; } }
  @media (max-width: 520px) {
    .svc { grid-template-columns: minmax(0, 1fr) auto; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .svc .name { grid-column: 1 / -1; }
  }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } .themes { grid-template-columns: repeat(2, minmax(0, 1fr)); } .soc { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Прайс-лист</h1><p>конструктор для мастеров · прототип</p>
  </header>

  <div class="grid">
    <form class="panel" id="form" novalidate>
      <section class="group">
        <h2>Дизайн</h2>
        <div class="themes" id="themes"></div>
        <div class="seg" id="formats"></div>
      </section>

      <section class="group">
        <h2>Шапка</h2>
        <div class="field">
          <label for="prof">Профессия</label>
          <select id="prof"></select>
        </div>
        <div class="row">
          <div class="field">
            <label for="title">Заголовок</label>
            <input id="title" type="text" maxlength="24">
          </div>
          <div class="field">
            <label for="subtitle">Подзаголовок</label>
            <input id="subtitle" type="text" maxlength="40">
          </div>
        </div>
        <div class="field">
          <label for="master" class="req">Имя мастера</label>
          <input id="master" type="text" maxlength="40" placeholder="Например, Лариса Чурилова">
        </div>
      </section>

      <section class="group">
        <h2>Услуги</h2>
        <div class="svcs" id="svcs"></div>
        <div class="add">
          <button class="btn ghost" type="button" id="addBtn">+ Добавить услугу</button>
          <select id="addSel" hidden aria-label="Выберите услугу"></select>
        </div>
        <div class="field">
          <label for="currency">Как писать цену</label>
          <select id="currency">
            <option value="руб.">3 000 руб.</option>
            <option value="₽">3 000 ₽</option>
          </select>
        </div>
      </section>

      <section class="group">
        <h2>Контакты</h2>
        <div class="field">
          <label for="phone" class="req">Телефон</label>
          <input id="phone" type="tel" inputmode="tel" placeholder="+7 (900) 000-00-00">
        </div>
        <span class="lbl">Соцсети — любые или ни одной</span>
        <div id="socs" class="svcs"></div>
        <div class="field">
          <label for="qr">QR-код на картинке</label>
          <select id="qr">
            <option value="none">Без QR-кода</option>
            <option value="wa">WhatsApp</option>
            <option value="tg">Telegram</option>
            <option value="ig">Instagram</option>
            <option value="max">MAX</option>
            <option value="url">Своя ссылка</option>
          </select>
        </div>
        <input id="qrUrl" type="url" placeholder="https://…" hidden aria-label="Ссылка для QR-кода">
        <span class="hint" id="qrHint"></span>
      </section>

      <section class="group">
        <label class="check"><input type="checkbox" id="watermark"> Водяной знак «ОБРАЗЕЦ»</label>
        <div class="btnrow">
          <button class="btn" type="button" id="download">Скачать картинку</button>
          <button class="btn ghost" type="button" id="share" hidden>Отправить</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </section>
    </form>

    <div class="preview">
      <canvas id="cv" aria-label="Превью прайс-листа"></canvas>
      <span class="hint" id="size"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---------- справочник услуг (Лэшмейкер — список Ларисы с ценами, остальное — по Яндекс Картам, без цен) ----------
const PROFS = [

    ["Объём 2,5D–3D", "3600"], ["Объём 4D–5D", "4000"], ["Снятие ресниц без последующего наращивания", "500"],
    ["Ламинирование ресниц", ""], ["Окрашивание ресниц", ""], ["Ботокс ресниц", ""]] },

    ["Ламинирование бровей", ""], ["Мужские брови", ""]] },
  { id: "nails", name: "Мастер маникюра и педикюра", subtitle: "Маникюр и педикюр", services: [
    ["Маникюр без покрытия", ""], ["Маникюр с покрытием гель-лаком", ""], ["Мужской маникюр", ""], ["Детский маникюр", ""],
    ["Педикюр без покрытия", ""], ["Педикюр с покрытием гель-лаком", ""], ["Smart-педикюр", ""], ["Снятие покрытия", ""],
    ["Дизайн ногтей", ""], ["Наращивание ногтей", ""], ["Укрепление ногтей", ""], ["Парафинотерапия", ""], ["SPA-уход для рук", ""]] },
  { id: "hair", name: "Парикмахер-стилист", subtitle: "Стрижки и окрашивание", services: [
    ["Женская стрижка", ""], ["Мужская стрижка", ""], ["Детская стрижка", ""], ["Укладка", ""], ["Вечерняя / свадебная укладка", ""],
    ["Окрашивание в один тон", ""], ["Тонирование", ""], ["Мелирование", ""], ["Сложное окрашивание", ""],
    ["Кератиновое выпрямление", ""], ["Ботокс для волос", ""], ["Химическая завивка", ""], ["Уход для волос", ""]] },
  { id: "cosm", name: "Косметолог-эстетист", subtitle: "Уход за лицом", services: [
    ["Комбинированная чистка лица", ""], ["Ультразвуковая чистка лица", ""], ["Пилинг", ""], ["Карбоновый пилинг", ""],
    ["Массаж лица", ""], ["Уходовая процедура для лица", ""], ["Уход при акне", ""], ["RF-лифтинг", ""], ["Микротоки", ""]] },
  { id: "massage", name: "Массажист", subtitle: "Массаж", services: [
    ["Классический массаж спины", ""], ["Массаж воротниковой зоны", ""], ["Общий массаж", ""], ["Антицеллюлитный массаж", ""],
    ["Лимфодренажный массаж", ""], ["Массаж лица", ""], ["Массаж стоп", ""], ["Релакс-массаж", ""], ["Спортивный массаж", ""], ["Баночный массаж", ""]] },
  { id: "depil", name: "Мастер депиляции", subtitle: "Шугаринг и воск", services: [
    ["Подмышки", ""], ["Бикини классическое", ""], ["Бикини глубокое", ""], ["Ноги полностью", ""], ["Голени", ""],
    ["Руки до локтя", ""], ["Верхняя губа", ""], ["Комплекс: глубокое бикини + подмышки + ноги", ""]] },
  { id: "pm", name: "Мастер перманентного макияжа", subtitle: "Перманентный макияж", services: [
    ["Пудровые брови", ""], ["Перманент губ", ""], ["Межресничка", ""], ["Стрелка", ""], ["Коррекция перманента", ""], ["Удаление перманента ремувером", ""]] },
  { id: "barber", name: "Барбер", subtitle: "Мужские стрижки", services: [
    ["Мужская стрижка", ""], ["Стрижка машинкой", ""], ["Стрижка бороды", ""], ["Стрижка + борода", ""], ["Королевское бритьё", ""],
    ["Детская стрижка", ""], ["Камуфляж седины", ""]] },
];
const SOCIALS = [
  { k: "wa", name: "WhatsApp", ph: "номер, если не тот же" },
  { k: "tg", name: "Telegram", ph: "@ник или t.me/…" },
  { k: "ig", name: "Instagram", ph: "@ник" },
  { k: "max", name: "MAX", ph: "ссылка или номер" },
];
const FORMATS = {
  story: { name: "Сторис 9:16", h: 1920, top: 150, bottom: 130, qr: 250 },
  post:  { name: "Пост 4:5",   h: 1350, top: 80,  bottom: 80,  qr: 200 },
};

// ---------- оформления ----------
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function vgrad(c, H, a, b) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function sprig(c, x, y, len, ang, col) {                       // веточка с листьями
  c.save(); c.translate(x, y); c.rotate(ang); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3;
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len / 2, -len * .1, len, 0); c.stroke();
  for (let i = 1; i <= 7; i++) {
    const t = i / 8, px = len * t, py = -len * .1 * 2 * t * (1 - t), leaf = len * .11 * (1 - t * .45);
    [-1, 1].forEach(side => {
      c.save(); c.translate(px, py); c.rotate(side * .75 - .25); c.globalAlpha = .6;
      c.beginPath(); c.ellipse(leaf, 0, leaf, leaf * .38, 0, 0, Math.PI * 2); c.fill(); c.restore();
    });
  }
  c.restore();
}
const THEMES = {
  gold: { name: "Чёрное золото", sw: "linear-gradient(135deg,#0f0d0b 55%,#d9bd7c 55%)", title: "caps",
    ink: "#efe6d6", muted: "#b49f7b", accent: "gold", dots: "rgba(201,169,96,.55)", qrTile: ["#f1e3bd", "#d9bf85"], qrInk: "#16120e", mark: .09,
    bg(c, W, H) {
      const g = c.createRadialGradient(W / 2, H * .35, 0, W / 2, H * .35, H * .8);
      g.addColorStop(0, "#211c17"); g.addColorStop(1, "#0b0a09"); c.fillStyle = g; c.fillRect(0, 0, W, H);
      c.strokeStyle = "#c9a960"; c.lineWidth = 2;
      [[46, 46, 1, 1], [W - 46, 46, -1, 1], [46, H - 46, 1, -1], [W - 46, H - 46, -1, -1]].forEach(([x, y, sx, sy]) => {
        c.beginPath(); c.moveTo(x + sx * 150, y); c.lineTo(x, y); c.lineTo(x, y + sy * 150); c.stroke();
      });
    } },
  powder: { name: "Пудра", sw: "linear-gradient(135deg,#f8e6e2 55%,#b0707a 55%)", title: "script",
    ink: "#5a3d42", muted: "#9a7479", accent: "#a8636f", dots: "rgba(168,99,111,.45)", qrTile: ["#fff8f6", "#fff8f6"], qrInk: "#5a3d42", mark: .1,
    bg(c, W, H) {
      c.fillStyle = vgrad(c, H, "#fbefec", "#f0d8d3"); c.fillRect(0, 0, W, H);
      [[W * .92, H * .06, 270, "rgba(232,190,183,.6)"], [W * .04, H * .97, 320, "rgba(243,205,198,.7)"], [W * .98, H * .72, 150, "rgba(236,200,193,.55)"], [W * .02, H * .3, 90, "rgba(236,200,193,.5)"]]
        .forEach(([x, y, r, col]) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); });
    } },
  minimal: { name: "Минимализм", sw: "linear-gradient(135deg,#fbfaf7 55%,#1f1f1f 55%)", title: "caps",
    ink: "#1f1f1f", muted: "#7b7b7b", accent: "#1f1f1f", dots: "rgba(0,0,0,.35)", qrTile: ["#ffffff", "#ffffff"], qrInk: "#111111", mark: .08,
    bg(c, W, H) {
      c.fillStyle = "#faf9f6"; c.fillRect(0, 0, W, H);
      c.strokeStyle = "#1f1f1f"; c.lineWidth = 1.6; c.strokeRect(40, 40, W - 80, H - 80);
      c.lineWidth = .8; c.strokeRect(52, 52, W - 104, H - 104);
    } },
  nude: { name: "Нюд", sw: "linear-gradient(135deg,#eadccb 55%,#8a6447 55%)", title: "script",
    ink: "#4b382b", muted: "#8f765f", accent: "#8a6447", dots: "rgba(138,100,71,.45)", qrTile: ["#f8f1e8", "#f8f1e8"], qrInk: "#4b382b", mark: .1,
    bg(c, W, H) {
      c.fillStyle = vgrad(c, H, "#ecdfcf", "#e0ccb5"); c.fillRect(0, 0, W, H);
      const x0 = 60, x1 = W - 60, r = (x1 - x0) / 2, top = 56 + r;
      c.beginPath(); c.moveTo(x0, H - 56); c.lineTo(x0, top); c.arc(W / 2, top, r, Math.PI, 0); c.lineTo(x1, H - 56); c.closePath();
      c.fillStyle = "rgba(248,241,232,.8)"; c.fill(); c.strokeStyle = "#c7aa8b"; c.lineWidth = 2; c.stroke();
    } },
  sage: { name: "Шалфей", sw: "linear-gradient(135deg,#e1e7da 55%,#5d7357 55%)", title: "caps",
    ink: "#2e392b", muted: "#6d7d67", accent: "#4f654a", dots: "rgba(79,101,74,.45)", qrTile: ["#f6f8f2", "#f6f8f2"], qrInk: "#2e392b", mark: .1,
    bg(c, W, H) {
      c.fillStyle = vgrad(c, H, "#e8ede2", "#d6dfcd"); c.fillRect(0, 0, W, H);
      sprig(c, -20, 120, 330, -.35, "#7f9878"); sprig(c, 40, -30, 260, .55, "#93aa8b");
      sprig(c, W + 20, H - 120, 330, Math.PI - .35, "#7f9878"); sprig(c, W - 40, H + 30, 260, Math.PI + .55, "#93aa8b");
    } },
  night: { name: "Лавандовая ночь", sw: "linear-gradient(135deg,#241b30 55%,#cfb0e6 55%)", title: "script",
    ink: "#f1e8f7", muted: "#b7a3c7", accent: "#d4b5ea", dots: "rgba(212,181,234,.5)", qrTile: ["#f5eefb", "#e2d1f0"], qrInk: "#241b30", mark: .08,
    bg(c, W, H) {
      const g = c.createRadialGradient(W / 2, H * .3, 0, W / 2, H * .3, H * .85);
      g.addColorStop(0, "#36284d"); g.addColorStop(1, "#15101d"); c.fillStyle = g; c.fillRect(0, 0, W, H);
      const r = rnd(7); c.fillStyle = "#eadff6";
      for (let i = 0; i < 90; i++) { c.globalAlpha = .15 + r() * .55; c.beginPath(); c.arc(r() * W, r() * H, .8 + r() * 1.8, 0, Math.PI * 2); c.fill(); }
      c.globalAlpha = 1;
    } },
};

// ---------- состояние ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const DEFAULT = () => ({
  theme: "gold", format: "story", prof: "lash", title: "Прайс-лист", subtitle: "Наращивание ресниц", master: "", phone: "",
  currency: "руб.", services: PROFS[0].services.slice(0, 7).map(([name, price]) => ({ name, price })),
  soc: { wa: { on: false, val: "" }, tg: { on: false, val: "" }, ig: { on: false, val: "" }, max: { on: false, val: "" } },
  qr: "none", qrUrl: "", watermark: true,
});
let S = DEFAULT();
try { const saved = JSON.parse(store.get("price.v1")); if (saved && Array.isArray(saved.services)) S = { ...S, ...saved, soc: { ...S.soc, ...saved.soc } }; } catch (e) {}

// ---------- форматы ----------
const $ = id => document.getElementById(id);
const digits = s => (s || "").replace(/\D/g, "");
function normPhone(s) {                                         // → 79001234567 или ""
  let d = digits(s);
  if (d.length === 10) d = "7" + d;
  if (d.length === 11 && d[0] === "8") d = "7" + d.slice(1);
  return d.length === 11 && d[0] === "7" ? d : "";
}
function fmtPhone(s) {
  const d = normPhone(s);
  return d ? `+7 (${d.slice(1, 4)}) ${d.slice(4, 7)}-${d.slice(7, 9)}-${d.slice(9)}` : (s || "").trim();
}
const group = n => n.replace(/\B(?=(\d{3})+(?!\d))/g, " ");          // 3000 → 3 000 (неразрывный пробел)
function fmtPrice(raw) {
  const p = (raw || "").trim();
  if (!p) return "";
  if (/₽|руб/i.test(p) || !/\d/.test(p)) return p;
  return p.replace(/\d{4,}/g, group) + " " + S.currency;
}
const handle = (v, host) => {
  const m = v.match(new RegExp(host.replace(".", "\\.") + "/([^/?#]+)"));
  if (m) return "@" + m[1];
  return /^https?:/i.test(v) ? v.replace(/^https?:\/\/(www\.)?/i, "") : "@" + v.replace(/^@/, "");
};
function socText(k) {
  const v = S.soc[k].val.trim();
  if (k === "wa") return fmtPhone(v || S.phone) || "WhatsApp";
  if (k === "tg") return v ? handle(v, "t.me") : "@ник";
  if (k === "ig") return v ? handle(v, "instagram.com") : "@ник";
  return v ? (/^https?:/i.test(v) ? v.replace(/^https?:\/\/(www\.)?/i, "") : fmtPhone(v)) : (fmtPhone(S.phone) || "MAX");
}
function qrTarget() {                                           // ссылка для QR или "" с подсказкой, чего не хватает
  const v = k => S.soc[k].val.trim(), user = s => s.replace(/^@/, "");
  switch (S.qr) {
    case "wa": { const d = normPhone(v("wa") || S.phone); return d ? { url: "https://wa.me/" + d, cap: "WhatsApp" } : { need: "Укажите телефон, чтобы QR вёл в WhatsApp." }; }
    case "tg": return v("tg") ? { url: /^https?:/i.test(v("tg")) ? v("tg") : "https://t.me/" + user(v("tg")), cap: "Telegram" } : { need: "Впишите ник Telegram в соцсетях." };
    case "ig": return v("ig") ? { url: /^https?:/i.test(v("ig")) ? v("ig") : "https://instagram.com/" + user(v("ig")), cap: "Instagram" } : { need: "Впишите ник Instagram в соцсетях." };
    case "max": return /^https?:/i.test(v("max")) ? { url: v("max"), cap: "MAX" } : { need: "Для QR вставьте в поле MAX ссылку на профиль (https://…)." };
    case "url": {
      const u = S.qrUrl.trim();
      if (!u) return { need: "Вставьте ссылку для QR-кода." };
      const url = /^https?:/i.test(u) ? u : "https://" + u;
      let cap = url; try { cap = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {}
      return { url, cap };
    }
  }
  return {};
}

// ---------- рисование ----------
const W = 1080, SCALE = 2;
const canvas = $("cv"), ctx = canvas.getContext("2d");
let H = 1920;
const th = () => THEMES[S.theme] || THEMES.gold;
function paint(fill, x0, x1) {
  if (fill !== "gold") return fill;
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, "#9c7a3c"); g.addColorStop(.35, "#e0c78e"); g.addColorStop(.65, "#a8843f"); g.addColorStop(1, "#d9bd7c");
  return g;
}
const sized = (font, k) => font.replace(/(\d+(?:\.\d+)?)px/, (_, n) => (n * k).toFixed(1) + "px");
function spaced(text, cx, y, font, spacing, fill, maxW) {       // разрядка вручную — работает во всех браузерах
  ctx.font = font;
  const chars = [...text];
  const width = () => chars.reduce((a, c) => a + ctx.measureText(c).width, 0) + spacing * (chars.length - 1);
  let total = width();
  if (maxW && total > maxW) { const k = maxW / total; ctx.font = sized(font, k); spacing *= k; total = width(); }
  let x = cx - total / 2;
  ctx.fillStyle = paint(fill, x, x + total); ctx.textAlign = "left";
  chars.forEach(c => { ctx.fillText(c, x, y); x += ctx.measureText(c).width + spacing; });
}
function centered(text, cx, y, font, fill, maxW) {
  ctx.font = font;
  let w = ctx.measureText(text).width;
  if (maxW && w > maxW) { ctx.font = sized(font, maxW / w); w = ctx.measureText(text).width; }
  ctx.textAlign = "left"; ctx.fillStyle = paint(fill, cx - w / 2, cx + w / 2);
  ctx.fillText(text, cx - w / 2, y);
}
function wrap(text, maxW) {
  const words = text.trim().split(/\s+/), lines = [];
  let cur = "";
  words.forEach(w => {
    const t = cur ? cur + " " + w : w;
    if (cur && ctx.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  });
  if (cur) lines.push(cur);
  return lines;
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

const ICONS = {                                                 // свои простые значки, не логотипы
  phone: ["M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"],
  wa: ["M3.2 20.8l1.4-4.3A8.7 8.7 0 1 1 7.6 19.5z", "M9 8.2c.2 3.4 3.4 6.6 6.8 6.8l1.2-1.6-2.2-1.1-1 .9a5.2 5.2 0 0 1-2.9-2.9l.9-1-1.1-2.2z"],
  tg: ["M21.4 3.6 2.9 10.8c-.9.4-.8 1.6.1 1.9l4.6 1.4 1.7 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.7 3.5c.6.4 1.5.1 1.6-.6l2.9-15.6c.2-.9-.6-1.6-1.4-1.3z", "M7.6 14.1l9.6-6.6-6.5 7.5"],
  ig: ["M7 2.5h10A4.5 4.5 0 0 1 21.5 7v10a4.5 4.5 0 0 1-4.5 4.5H7A4.5 4.5 0 0 1 2.5 17V7A4.5 4.5 0 0 1 7 2.5z", "M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z", "M17.5 6.3v.1"],
  max: ["M12 2.5a9.5 9.5 0 1 1-4.4 17.9L3 21.5l1.2-4.3A9.5 9.5 0 0 1 12 2.5z", "M8 15V9l4 4 4-4v6"],
};
function icon(name, x, y, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color; ctx.lineWidth = 1.7; ctx.lineJoin = "round"; ctx.lineCap = "round";
  ICONS[name].forEach(d => ctx.stroke(new Path2D(d)));
  ctx.restore();
}
function ornament(cx, y, t) {
  ctx.strokeStyle = paint(t.accent, cx - 130, cx + 130); ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - 130, y); ctx.lineTo(cx - 16, y); ctx.moveTo(cx + 16, y); ctx.lineTo(cx + 130, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, y - 7); ctx.lineTo(cx + 7, y); ctx.lineTo(cx, y + 7); ctx.lineTo(cx - 7, y); ctx.closePath(); ctx.fill();
}
function drawQr(url, x, y, size, t) {
  const g = ctx.createLinearGradient(x, y, x + size, y + size);
  g.addColorStop(0, t.qrTile[0]); g.addColorStop(1, t.qrTile[1]);
  ctx.fillStyle = g; roundRect(x, y, size, size, 16); ctx.fill();
  if (typeof qrcode !== "function") return;
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), pad = size * .07, m = (size - pad * 2) / n;
  ctx.fillStyle = t.qrInk;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(x + pad + c * m, y + pad + r * m, m + .03, m + .03);
}

function footer(t, F, P) {                                      // считает высоту подвала и умеет его нарисовать
  const story = F === FORMATS.story;
  const lines = [{ icon: "phone", text: fmtPhone(S.phone) || "+7 (___) ___-__-__", size: story ? 44 : 38, weight: 500, color: S.phone ? t.ink : t.muted }];
  SOCIALS.forEach(s => { if (S.soc[s.k].on) lines.push({ icon: s.k, text: socText(s.k), size: story ? 32 : 28, weight: 400, color: t.ink }); });
  const lh = l => l.size * 1.65, textH = lines.reduce((a, l) => a + lh(l), 0) - lines[lines.length - 1].size * .65;
  const qr = qrTarget(), qs = F.qr, capH = 46;
  const h = Math.max(textH, qr.url ? qs + capH : 0);
  return { h, draw(top) {
    const colW = qr.url ? W - 2 * P - qs - 44 : W - 2 * P;
    let y = top + (h - textH) / 2;
    lines.forEach(l => {
      let font = `${l.weight} ${l.size}px "Montserrat"`, size = l.size;
      ctx.font = font;
      const iw = size * .9, gap = size * .4;
      let w = ctx.measureText(l.text).width;
      if (iw + gap + w > colW) { const k = (colW - iw - gap) / w; size *= k; font = sized(font, k); ctx.font = font; w = ctx.measureText(l.text).width; }
      const x = qr.url ? P : W / 2 - (iw + gap + w) / 2, base = y + l.size;
      icon(l.icon, x, base - size * .82, iw, l.color === t.ink ? (t.accent === "gold" ? "#c9a960" : t.accent) : l.color);
      ctx.fillStyle = l.color; ctx.textAlign = "left"; ctx.fillText(l.text, x + iw + gap, base);
      y += lh(l);
    });
    if (qr.url) {
      const qx = W - P - qs, qy = top + (h - qs - capH) / 2;
      drawQr(qr.url, qx, qy, qs, t);
      centered(qr.cap, qx + qs / 2, qy + qs + 36, '500 24px "Montserrat"', t.muted, qs + 40);
    }
  } };
}

function services(top, bottom, t, P) {
  const items = S.services.filter(s => s.name.trim() || s.price.trim());
  const cw = W - 2 * P, avail = bottom - top;
  if (!items.length) { centered("Добавьте услуги кнопкой «+»", W / 2, (top + bottom) / 2, '400 30px "Montserrat"', t.muted); return; }
  let s, rows, lineH, gap, total;
  for (s = 42; s >= 18; s--) {                                  // подбираем кегль, чтобы список влез
    ctx.font = `600 ${s}px "Montserrat"`;
    const prices = items.map(it => fmtPrice(it.price));
    const priceW = Math.max(0, ...prices.map(p => ctx.measureText(p).width));
    ctx.font = `400 ${s}px "Montserrat"`;
    rows = items.map((it, i) => ({ lines: wrap(it.name || "—", cw - priceW - 44), price: prices[i] }));
    lineH = s * 1.32; gap = s * .9;
    total = rows.reduce((a, r) => a + r.lines.length * lineH, 0) + gap * (rows.length - 1);
    if (total <= avail) break;
  }
  let y = top + Math.max(0, (avail - total) * .45);
  rows.forEach(r => {
    ctx.font = `400 ${s}px "Montserrat"`; ctx.fillStyle = t.ink; ctx.textAlign = "left";
    r.lines.forEach((ln, i) => ctx.fillText(ln, P, y + s + i * lineH));
    const base = y + s + (r.lines.length - 1) * lineH;
    if (r.price) {
      const endX = P + ctx.measureText(r.lines[r.lines.length - 1]).width + 14;
      ctx.font = `600 ${s}px "Montserrat"`;
      const pw = ctx.measureText(r.price).width, px = W - P - pw;
      ctx.fillStyle = t.dots;
      for (let x = endX + 4; x < px - 14; x += 13) { ctx.beginPath(); ctx.arc(x, base - s * .12, 1.8, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = paint(t.accent, px, px + pw); ctx.fillText(r.price, px, base);
    }
    y += r.lines.length * lineH + gap;
  });
}

function watermark(t) {
  ctx.save(); ctx.globalAlpha = t.mark; ctx.fillStyle = t.ink; ctx.font = '600 104px "Montserrat"'; ctx.textAlign = "center";
  ctx.translate(W / 2, H / 2); ctx.rotate(-.5);
  for (let y = -H, row = 0; y < H; y += 300, row++) for (let x = -W * 1.5 + (row % 2) * 330; x < W * 1.5; x += 660) ctx.fillText("ОБРАЗЕЦ", x, y);
  ctx.restore();
}

function draw() {
  const t = th(), F = FORMATS[S.format] || FORMATS.story, P = 96, cw = W - 2 * P;
  if (H !== F.h || canvas.width !== W * SCALE) { H = F.h; canvas.width = W * SCALE; canvas.height = H * SCALE; }
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  t.bg(ctx, W, H);
  let y = F.top;
  const title = S.title.trim() || "Прайс-лист";
  const k = F === FORMATS.story ? 1 : .86;                      // в посте шапка чуть меньше
  if (t.title === "script") { y += 104 * k; centered(title, W / 2, y, `${128 * k}px "Marck Script"`, t.accent, cw * k); y += 24; }
  else { y += 78 * k; spaced(title.toUpperCase(), W / 2, y, `600 ${84 * k}px "Cormorant Garamond"`, 10, t.accent, cw * k); y += 18; }
  if (S.subtitle.trim()) { y += 50; spaced(S.subtitle.trim().toUpperCase(), W / 2, y, '500 24px "Montserrat"', 6, t.muted, cw); }
  y += 72; centered(S.master.trim() || "Имя мастера", W / 2, y, 'italic 500 54px "Cormorant Garamond"', S.master.trim() ? t.ink : t.muted, cw);
  y += 48; ornament(W / 2, y, t);
  const foot = footer(t, F, P), footTop = H - F.bottom - foot.h;
  services(y + 56, footTop - 64, t, P);
  foot.draw(footTop);
  if (S.watermark) watermark(t);
  $("size").textContent = `Картинка ${W * SCALE} × ${H * SCALE} — для сторис, мессенджеров и печати`;
}

// ---------- форма ----------
let raf = 0;
function changed() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(draw);
  store.set("price.v1", JSON.stringify(S));
  const q = qrTarget();
  $("qrUrl").hidden = S.qr !== "url";
  $("qrHint").textContent = q.need || "";
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildThemes() {
  $("themes").innerHTML = Object.entries(THEMES).map(([k, t]) =>
    `<button type="button" class="theme" data-k="${k}" aria-pressed="${k === S.theme}"><i style="background:${t.sw}"></i>${t.name}</button>`).join("");
  $("formats").innerHTML = Object.entries(FORMATS).map(([k, f]) =>
    `<button type="button" data-k="${k}" aria-pressed="${k === S.format}">${f.name}</button>`).join("");
}
$("themes").addEventListener("click", e => { const b = e.target.closest(".theme"); if (!b) return; S.theme = b.dataset.k; buildThemes(); changed(); });
$("formats").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.format = b.dataset.k; buildThemes(); changed(); });

function buildServices() {
  const n = S.services.length;
  $("svcs").innerHTML = n ? S.services.map((s, i) => `<div class="svc" data-i="${i}">
      <input type="text" class="name" value="${esc(s.name)}" placeholder="Название услуги" aria-label="Услуга">
      <input type="text" class="price" value="${esc(s.price)}" placeholder="цена" inputmode="numeric" aria-label="Цена">
      <span class="tools">
        <button type="button" class="icon" data-act="up" aria-label="Выше" ${i ? "" : "disabled"}>↑</button>
        <button type="button" class="icon" data-act="down" aria-label="Ниже" ${i < n - 1 ? "" : "disabled"}>↓</button>
        <button type="button" class="icon" data-act="del" aria-label="Удалить">×</button>
      </span></div>`).join("")
    : `<div class="empty">Пока пусто — добавьте первую услугу.</div>`;
}
$("svcs").addEventListener("input", e => {
  const row = e.target.closest(".svc"); if (!row) return;
  S.services[row.dataset.i][e.target.classList.contains("name") ? "name" : "price"] = e.target.value; changed();
});
$("svcs").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const i = +b.closest(".svc").dataset.i, L = S.services;
  if (b.dataset.act === "del") L.splice(i, 1);
  if (b.dataset.act === "up" && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
  if (b.dataset.act === "down" && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
  buildServices(); changed();
});

function buildAddList() {                                       // текущая профессия сверху, уже добавленные не показываем
  const have = new Set(S.services.map(s => s.name.trim().toLowerCase()));
  const order = [...PROFS].sort((a, b) => (b.id === S.prof) - (a.id === S.prof));
  $("addSel").innerHTML = `<option value="">Выберите услугу…</option><option value="__custom">✎ Своя услуга — вписать вручную</option>` +
    order.map(p => {
      const opts = p.services.filter(([n]) => !have.has(n.toLowerCase()))
        .map(([n, pr]) => `<option value="${p.id}|${esc(n)}">${esc(n)}${pr ? " — " + group(pr) : ""}</option>`).join("");
      return opts ? `<optgroup label="${esc(p.name)}">${opts}</optgroup>` : "";
    }).join("");
}
$("addBtn").addEventListener("click", () => {
  buildAddList(); const sel = $("addSel"); sel.hidden = !sel.hidden;
  if (!sel.hidden) { sel.value = ""; sel.focus(); if (sel.showPicker) try { sel.showPicker(); } catch (e) {} }
});
$("addSel").addEventListener("change", e => {
  const v = e.target.value; if (!v) return;
  if (v === "__custom") S.services.push({ name: "", price: "" });
  else {
    const [pid, name] = v.split("|"), p = PROFS.find(x => x.id === pid), svc = p.services.find(([n]) => n === name);
    S.services.push({ name, price: svc ? svc[1] : "" });
  }
  e.target.hidden = true; buildServices(); changed();
  const rows = $("svcs").querySelectorAll(".svc"), last = rows[rows.length - 1];
  if (last) (v === "__custom" ? last.querySelector(".name") : last.querySelector(".price")).focus();
});

function buildSocs() {
  $("socs").innerHTML = SOCIALS.map(s => `<div class="soc">
      <label class="check"><input type="checkbox" data-k="${s.k}" ${S.soc[s.k].on ? "checked" : ""}> ${s.name}</label>
      <input type="text" data-k="${s.k}" value="${esc(S.soc[s.k].val)}" placeholder="${s.ph}" aria-label="${s.name}" ${S.soc[s.k].on ? "" : "hidden"}>
    </div>`).join("");
}
$("socs").addEventListener("input", e => {
  const k = e.target.dataset.k; if (!k) return;
  if (e.target.type === "checkbox") {
    S.soc[k].on = e.target.checked;
    const inp = e.target.closest(".soc").querySelector('input[type="text"]'); inp.hidden = !e.target.checked;
    if (e.target.checked) inp.focus();
  } else S.soc[k].val = e.target.value;
  changed();
});

$("prof").innerHTML = PROFS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
$("prof").addEventListener("change", e => {
  const old = PROFS.find(p => p.id === S.prof), now = PROFS.find(p => p.id === e.target.value);
  if (!S.subtitle.trim() || (old && S.subtitle === old.subtitle)) { S.subtitle = now.subtitle; $("subtitle").value = S.subtitle; }
  S.prof = now.id; changed();
});
["title", "subtitle", "master", "phone", "qrUrl"].forEach(id => $(id).addEventListener("input", e => { S[id] = e.target.value; changed(); }));
$("phone").addEventListener("blur", e => { if (normPhone(e.target.value)) { S.phone = e.target.value = fmtPhone(e.target.value); changed(); } });
$("currency").addEventListener("change", e => { S.currency = e.target.value; changed(); });
$("qr").addEventListener("change", e => { S.qr = e.target.value; changed(); if (S.qr === "url") $("qrUrl").focus(); });
$("watermark").addEventListener("change", e => { S.watermark = e.target.checked; changed(); });

// ---------- сохранить и отправить ----------
function setStatus(text, kind) { const s = $("status"); s.textContent = text; s.className = "status" + (kind ? " " + kind : ""); }
function ready() {
  if (!S.master.trim()) { setStatus("Укажите имя мастера.", "err"); $("master").focus(); return false; }
  if (!S.phone.trim()) { setStatus("Укажите телефон.", "err"); $("phone").focus(); return false; }
  if (!S.services.some(s => s.name.trim())) { setStatus("Добавьте хотя бы одну услугу.", "err"); return false; }
  setStatus(""); return true;
}
const fileName = () => `Прайс_${S.master.trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_") || "мастер"}.png`;
const blobNow = () => { draw(); return new Promise(r => canvas.toBlob(r, "image/png")); };
$("download").addEventListener("click", async () => {
  if (!ready()) return;
  const b = await blobNow(), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = fileName(); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  setStatus("Картинка сохранена.", "ok");
});
$("share").hidden = !(navigator.canShare && navigator.canShare({ files: [new File([new Blob(["x"])], "x.png", { type: "image/png" })] }));
$("share").addEventListener("click", async () => {
  if (!ready()) return;
  try { await navigator.share({ files: [new File([await blobNow()], fileName(), { type: "image/png" })], title: "Прайс-лист" }); }
  catch (e) { if (e && e.name !== "AbortError") setStatus("Отправить не получилось — скачайте картинку.", "err"); }
});

// ---------- старт ----------
["title", "subtitle", "master", "phone", "qrUrl"].forEach(id => $(id).value = S[id]);
$("prof").value = S.prof; $("currency").value = S.currency; $("qr").value = S.qr; $("watermark").checked = S.watermark;
buildThemes(); buildServices(); buildSocs(); changed();
Promise.all([
  document.fonts.load('600 84px "Cormorant Garamond"', "ПРАЙС-ЛИСТ"),
  document.fonts.load('italic 500 54px "Cormorant Garamond"', "Имя мастера"),
  document.fonts.load('128px "Marck Script"', "Прайс-лист"),
  document.fonts.load('400 30px "Montserrat"', "Услуги 0123456789"),
  document.fonts.load('500 30px "Montserrat"', "ТЕЛЕФОН +7"),
  document.fonts.load('600 30px "Montserrat"', "3 000 руб. ₽ ОБРАЗЕЦ"),
]).catch(() => {}).then(changed);
</script>
