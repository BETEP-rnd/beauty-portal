<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<title>Конструктор прайс-листа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Raleway:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@400;700&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,700;1,400&family=Prata&family=Forum&family=Poiret+One&family=Marck+Script&family=Bad+Script&family=Caveat:wght@400;700&family=Lobster&family=Amatic+SC:wght@400;700&display=swap">
<style>
  /* Форма с вкладками слева, живое превью картинки справа; на телефоне превью сверху. */
  :root {
    --bg: #f7f3ee; --panel: #ffffff; --line: #e6dcd0; --field: #fffdfa;
    --text: #2b2420; --muted: #8a7b6e; --accent: #9b6b4f; --accent-ink: #ffffff; --bad: #b8483a; --ok: #4f7f45;
    --ui: "Montserrat", "Segoe UI", system-ui, sans-serif;
    --display: "Cormorant Garamond", "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16120f; --panel: #1f1a16; --line: #3a3029; --field: #1a1613;
      --text: #eee5da; --muted: #a8988a; --accent: #d2a37f; --accent-ink: #1a120c; --bad: #e08a6a; --ok: #8fbf7a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 15px;
    padding: calc(22px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1; }
  header p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 36px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 22px 22px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  nav.tabs { display: flex; border-bottom: 1px solid var(--line); margin: 0 -22px; padding: 0 12px; overflow-x: auto; }
  nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 16px 12px 12px; font: inherit; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab { display: flex; flex-direction: column; gap: 22px; }
  section.group { display: flex; flex-direction: column; gap: 12px; }
  section.group + section.group { border-top: 1px solid var(--line); padding-top: 20px; }
  h2 { margin: 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label, .lbl { font-size: 12px; color: var(--muted); }
  .req::after { content: " *"; color: var(--bad); }
  input[type="text"], input[type="tel"], input[type="url"], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 0;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: var(--field); color: var(--text); font: inherit; font-size: 13.5px; padding: 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip { border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 99px; padding: 8px 14px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
  .thumb { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 8px; line-height: 0; }
  .thumb canvas { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
  .thumb[aria-pressed="true"] canvas { box-shadow: 0 0 0 3px var(--accent); }

  .svcs { display: flex; flex-direction: column; gap: 8px; }
  .svc { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 6px; align-items: center; }
  .svc .tools { display: flex; gap: 4px; }
  .icon { border: 1px solid var(--line); background: var(--field); color: var(--muted); font: inherit; font-size: 15px; width: 34px; height: 40px; border-radius: 8px; cursor: pointer; padding: 0; }
  .icon:hover { color: var(--text); }
  .icon:disabled { opacity: .35; cursor: default; }
  .icon.del { color: var(--bad); font-size: 20px; }
  .empty { font-size: 13.5px; color: var(--muted); padding: 6px 0; }
  .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .btn { font: inherit; font-size: 14px; cursor: pointer; border-radius: 10px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .btnrow .btn { flex: 1 1 140px; }
  .linkbtn { background: none; border: 0; color: var(--accent); padding: 2px; font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; }

  .socchips { display: flex; gap: 8px; flex-wrap: wrap; }
  .socin { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

  .tstyle { display: flex; flex-direction: column; gap: 8px; }
  .tstyle + .tstyle { border-top: 1px solid var(--line); padding-top: 14px; }
  .thead { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; }
  .trow { display: flex; gap: 8px; align-items: center; }
  .trow select { flex: 1; }
  .trow input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .tval { font-size: 12.5px; color: var(--muted); width: 42px; text-align: right; }
  .tog { border: 1px solid var(--line); background: var(--field); color: var(--text); width: 38px; height: 38px; border-radius: 8px; font: inherit; font-size: 15px; cursor: pointer; padding: 0; }
  .tog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  input[type="color"] { width: 42px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 3px; cursor: pointer; }

  .status { min-height: 1.3em; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
  .status.err { color: var(--bad); }
  .status.ok { color: var(--ok); }
  .preview { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
  .preview canvas { width: 100%; max-width: 460px; height: auto; border-radius: 8px; box-shadow: 0 18px 50px rgba(40, 25, 15, .25); background: #ddd; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .preview { position: static; order: -1; } .preview canvas { max-width: 320px; } }
  @media (max-width: 520px) {
    .svc { grid-template-columns: minmax(0, 1fr) auto; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .svc .name { grid-column: 1 / -1; }
  }
  @media (max-width: 420px) {
    .row { grid-template-columns: 1fr; } .socin { grid-template-columns: 1fr; }
    nav.tabs button { flex: 1; padding: 14px 4px 10px; font-size: 12px; letter-spacing: .04em; }
    .thumbs { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Прайс-лист</h1><p>конструктор для мастеров · прототип</p>
  </header>

  <div class="grid">
    <form class="panel" id="form" novalidate>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="content">Содержание</button>
        <button type="button" role="tab" data-tab="design">Дизайн</button>
        <button type="button" role="tab" data-tab="fonts">Шрифты</button>
      </nav>

      <!-- Содержание -->
      <div class="tab" data-tab="content">
        <section class="group">
          <h2>Шапка</h2>
          <div class="field">
            <label for="prof">Профессия</label>
            <select id="prof"></select>
          </div>
          <div class="row">
            <div class="field">
              <label for="title">Заголовок</label>
              <input id="title" type="text" maxlength="24">
            </div>
            <div class="field">
              <label for="subtitle">Подзаголовок</label>
              <input id="subtitle" type="text" maxlength="40">
            </div>
          </div>
          <div class="field">
            <label for="master" class="req">Имя мастера</label>
            <input id="master" type="text" maxlength="40" placeholder="Например, Лариса Чурилова">
          </div>
        </section>

        <section class="group">
          <h2>Услуги</h2>
          <div class="svcs" id="svcs"></div>
          <button class="btn ghost" type="button" id="addBtn">+ Добавить услугу</button>
          <div class="addrow" id="addRow" hidden>
            <select id="addSel" aria-label="Выберите услугу"></select>
            <button class="btn ghost" type="button" id="addCancel">Отмена</button>
          </div>
          <div class="field">
            <label for="currency">Как писать цену</label>
            <select id="currency">
              <option value="руб.">3 000 руб.</option>
              <option value="₽">3 000 ₽</option>
            </select>
          </div>
        </section>

        <section class="group">
          <h2>Контакты</h2>
          <div class="field">
            <label for="phone" class="req">Телефон</label>
            <input id="phone" type="tel" inputmode="tel" placeholder="+7 (999) 999-99-99" maxlength="18">
          </div>
          <span class="lbl">Соцсети — любые или ни одной</span>
          <div class="socchips" id="socchips"></div>
          <div class="svcs" id="socs"></div>
          <div class="field">
            <span class="lbl">Соцсети на картинке</span>
            <div class="seg" id="socLayout">
              <button type="button" data-k="row">В строку</button>
              <button type="button" data-k="col">Столбиком</button>
            </div>
          </div>
          <div class="field">
            <label for="qr">QR-код на картинке</label>
            <select id="qr">
              <option value="none">Без QR-кода</option>
              <option value="wa">WhatsApp</option>
              <option value="tg">Telegram</option>
              <option value="ig">Instagram</option>
              <option value="max">MAX</option>
              <option value="url">Своя ссылка</option>
            </select>
          </div>
          <input id="qrUrl" type="url" placeholder="https://…" hidden aria-label="Ссылка для QR-кода">
          <span class="hint" id="qrHint"></span>
        </section>
      </div>

      <!-- Дизайн -->
      <div class="tab" data-tab="design" hidden>
        <section class="group">
          <h2>Формат</h2>
          <div class="seg" id="formats"></div>
        </section>
        <section class="group">
          <h2>Фон</h2>
          <div class="cats" id="cats"></div>
          <div class="thumbs" id="thumbs"></div>
          <span class="hint" id="themeName"></span>
        </section>
      </div>

      <!-- Шрифты -->
      <div class="tab" data-tab="fonts" hidden>
        <section class="group">
          <div class="thead"><h2>Шрифты и размер</h2><button type="button" class="linkbtn" id="resetAll">сбросить всё</button></div>
          <span class="hint">«Как в дизайне» — шрифт подбирается под выбранный фон. Список услуг сам уменьшится, если не влезает.</span>
          <div id="tstyles"></div>
        </section>
      </div>

      <section class="group">
        <label class="check"><input type="checkbox" id="watermark"> Водяной знак «ОБРАЗЕЦ»</label>
        <div class="btnrow">
          <button class="btn" type="button" id="download">Скачать картинку</button>
          <button class="btn ghost" type="button" id="share" hidden>Отправить</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </section>
    </form>

    <div class="preview">
      <canvas id="cv" aria-label="Превью прайс-листа"></canvas>
      <span class="hint" id="size"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---------- справочник услуг (Лэшмейкер — список Ларисы с ценами, остальное — по Яндекс Картам, без цен) ----------

];
const SOCIALS = [
  { k: "wa", name: "WhatsApp", ph: "номер, если не тот же" },
  { k: "tg", name: "Telegram", ph: "@ник или t.me/…" },
  { k: "ig", name: "Instagram", ph: "@ник" },

];
const FORMATS = {

  post:  { name: "Пост 4:5",   h: 1350, top: 80,  bottom: 80,  qr: 200 },

const FONTS = ["Montserrat", "Raleway", "Manrope", "Nunito", "Comfortaa", "Oswald", "Playfair Display", "Cormorant Garamond",
  "Lora", "Prata", "Forum", "Poiret One", "Marck Script", "Bad Script", "Caveat", "Lobster", "Amatic SC"];
const SCRIPTS = new Set(["Marck Script", "Bad Script", "Caveat", "Lobster", "Amatic SC"]);
const TEXTS = [
  { k: "title", name: "Заголовок" }, { k: "subtitle", name: "Подзаголовок" }, { k: "master", name: "Имя мастера" },
  { k: "services", name: "Услуги" }, { k: "prices", name: "Цены" }, { k: "contacts", name: "Контакты" },
];

// ---------- цвета и вспомогательное ----------
const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const A = (h, a) => `rgba(${rgb(h).join(",")},${a})`;
const mix = (h1, h2, t) => "#" + rgb(h1).map((v, i) => Math.round(v + (rgb(h2)[i] - v) * t).toString(16).padStart(2, "0")).join("");
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
const METAL = {
  gold: ["#9c7a3c", "#e0c78e", "#a8843f", "#d9bd7c", "#c9a960", "золото"],
  silver: ["#8e9297", "#eceff2", "#9fa4aa", "#d5d9dd", "#c3c7cc", "серебро"],
  rose: ["#a7695a", "#f0c4b4", "#b37766", "#e3a998", "#d39a88", "розовое золото"],
};
function paintOn(c, fill, x0, x1) {                             // металл — градиентом, остальное — как есть
  const m = METAL[fill];
  if (!m) return fill;
  const g = c.createLinearGradient(x0, 0, x1, 0);
  [0, .35, .65, 1].forEach((p, i) => g.addColorStop(p, m[i]));
  return g;
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

  const n = q.getModuleCount(), pad = size * .07, m = (size - pad * 2) / n;
  ctx.fillStyle = t.qrInk;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(x + pad + c * m, y + pad + r * m, m + .03, m + .03);
}

function footer(t, F, P) {                                      // считает высоту подвала и умеет его нарисовать
  const story = F === FORMATS.story, st = style("contacts", t), iconCol = c => (c === t.ink ? solid(t.accent) : solid(c));
  const phoneSize = (story ? 44 : 38) * st.size, socSize = (story ? 32 : 28) * st.size;
  const socWeight = S.text.contacts && S.text.contacts.bold != null ? st.weight : 400;
  const phone = { icon: "phone", text: fmtPhone(S.phone) || "+7 (999) 999-99-99", size: phoneSize, weight: st.weight, color: S.phone ? st.color : t.muted };
  const socs = SOCIALS.filter(s => S.soc[s.k].on).map(s => ({ icon: s.k, text: socText(s.k), size: socSize, weight: socWeight, color: st.color }));
  const qr = qrTarget(), qs = F.qr, capH = 46, colW = qr.url ? W - 2 * P - qs - 44 : W - 2 * P;
  const itemW = it => { ctx.font = fontOf(st, it.size, it.weight); return it.size * 1.3 + ctx.measureText(caseOf(st, it.text)).width; };
  let lines = [[phone]];                                        // строки подвала: телефон, потом соцсети
  if (S.socLayout === "col") socs.forEach(s => lines.push([s]));
  else {
    let cur = [], w = 0;
    socs.forEach(s => { const sw = itemW(s); if (cur.length && w + 34 + sw > colW) { lines.push(cur); cur = []; w = 0; } w += (cur.length ? 34 : 0) + sw; cur.push(s); });
    if (cur.length) lines.push(cur);
  }
  const lh = l => l[0].size * 1.65, textH = lines.reduce((a, l) => a + lh(l), 0) - lines[lines.length - 1][0].size * .65;
  const h = Math.max(textH, qr.url ? qs + capH : 0);
  return { h, draw(top) {
    let y = top + (h - textH) / 2;
    lines.forEach(line => {
      const size0 = line[0].size, base = y + size0;
      let total = line.reduce((a, it) => a + itemW(it), 0) + 34 * (line.length - 1), k = total > colW ? colW / total : 1;
      let x = qr.url ? P : W / 2 - total * k / 2;
      line.forEach(it => {
        const size = it.size * k, iw = size * .9, text = caseOf(st, it.text);
        ctx.font = fontOf(st, size, it.weight);
        icon(it.icon, x, base - size * .82, iw, iconCol(it.color));
        ctx.fillStyle = paint(it.color, x, x + 400); ctx.textAlign = "left"; ctx.fillText(text, x + size * 1.3, base);
        x += size * 1.3 + ctx.measureText(text).width + 34 * k;
      });
      y += lh(line);
    });
    if (qr.url) {
      const qx = W - P - qs, qy = top + (h - qs - capH) / 2;
      drawQr(qr.url, qx, qy, qs, t);
      centered(qr.cap, qx + qs / 2, qy + qs + 36, '500 24px "Montserrat"', t.muted, qs + 40);
    }
  } };
}

function services(top, bottom, t, P) {
  const items = S.services.filter(s => s.name.trim() || s.price.trim());
  const cw = W - 2 * P, avail = bottom - top, sn = style("services", t), sp = style("prices", t);
  if (!items.length) { centered("Добавьте услуги кнопкой «+»", W / 2, (top + bottom) / 2, '400 30px "Montserrat"', t.muted); return; }
  let s, rows, lineH, gap, total;
  const start = Math.min(80, 42 * sn.size);
  for (s = start; s >= 14; s -= 1) {                            // подбираем кегль, чтобы список влез
    const ps = s * sp.size / sn.size;
    ctx.font = fontOf(sp, ps);
    const prices = items.map(it => caseOf(sp, fmtPrice(it.price)));
    const priceW = Math.max(0, ...prices.map(p => ctx.measureText(p).width));
    ctx.font = fontOf(sn, s);
    rows = items.map((it, i) => ({ lines: wrap(caseOf(sn, it.name || "—"), cw - priceW - 44), price: prices[i] }));
    lineH = s * 1.32; gap = s * .9;
    total = rows.reduce((a, r) => a + r.lines.length * lineH, 0) + gap * (rows.length - 1);
    if (total <= avail) break;
  }
  const ps = s * sp.size / sn.size;
  let y = top + Math.max(0, (avail - total) * .45);
  rows.forEach(r => {
    ctx.font = fontOf(sn, s); ctx.fillStyle = paint(sn.color, P, W - P); ctx.textAlign = "left";
    r.lines.forEach((ln, i) => ctx.fillText(ln, P, y + s + i * lineH));
    const base = y + s + (r.lines.length - 1) * lineH;
    if (r.price) {
      const endX = P + ctx.measureText(r.lines[r.lines.length - 1]).width + 14;
      ctx.font = fontOf(sp, ps);
      const pw = ctx.measureText(r.price).width, px = W - P - pw;
      ctx.fillStyle = t.dots;
      for (let x = endX + 4; x < px - 14; x += 13) { ctx.beginPath(); ctx.arc(x, base - s * .12, 1.8, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = paint(sp.color, px, px + pw); ctx.fillText(r.price, px, base);
    }
    y += r.lines.length * lineH + gap;
  });
}

function watermark(t) {
  ctx.save(); ctx.globalAlpha = t.mark; ctx.fillStyle = t.ink; ctx.font = '600 104px "Montserrat"'; ctx.textAlign = "center";
  ctx.translate(W / 2, H / 2); ctx.rotate(-.5);
  for (let y = -H, row = 0; y < H; y += 300, row++) for (let x = -W * 1.5 + (row % 2) * 330; x < W * 1.5; x += 660) ctx.fillText("ОБРАЗЕЦ", x, y);
  ctx.restore();
}

function draw() {
  const t = th(), F = FORMATS[S.format] || FORMATS.story, P = 96, cw = W - 2 * P;
  if (H !== F.h || canvas.width !== W * SCALE) { H = F.h; canvas.width = W * SCALE; canvas.height = H * SCALE; }
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  drawBg(ctx, t, W, H);
  let y = F.top;
  const k = F === FORMATS.story ? 1 : .86;                      // в посте шапка чуть меньше
  const st = style("title", t), title = caseOf(st, S.title.trim() || "Прайс-лист");
  const tpx = (SCRIPTS.has(st.font) ? 128 : 84) * k * st.size;
  if (st.caps && !SCRIPTS.has(st.font)) { y += tpx * .93; spaced(title, W / 2, y, fontOf(st, tpx), 10 * k * st.size, st.color, cw * k); y += 18; }
  else { y += tpx * .81; centered(title, W / 2, y, fontOf(st, tpx), st.color, cw * k); y += 24; }
  const ss = style("subtitle", t), spx = 24 * ss.size;
  if (S.subtitle.trim()) { y += 26 + spx; spaced(caseOf(ss, S.subtitle.trim()), W / 2, y, fontOf(ss, spx), ss.caps ? 6 * ss.size : 0, ss.color, cw); }
  const sm = style("master", t), mpx = 54 * sm.size;
  y += 18 + mpx; centered(caseOf(sm, S.master.trim() || "Имя мастера"), W / 2, y, fontOf(sm, mpx), S.master.trim() ? sm.color : t.muted, cw);
  y += 48; ornament(W / 2, y, t);
  const foot = footer(t, F, P), footTop = H - F.bottom - foot.h;
  services(y + 56, footTop - 64, t, P);
  foot.draw(footTop);
  if (S.watermark) watermark(t);
  $("size").textContent = `Картинка ${W * SCALE} × ${H * SCALE} — для сторис, мессенджеров и печати`;
}
