<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<title>Конструктор прайс-листа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Raleway:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@400;700&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,700;1,400&family=Prata&family=Forum&family=Poiret+One&family=Marck+Script&family=Bad+Script&family=Caveat:wght@400;700&family=Lobster&family=Amatic+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="../kit/kit.css?v=202610250111">
<script>try { var u = localStorage.getItem("beauty.ui"); if (u) document.documentElement.dataset.ui = u; } catch (e) {}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Прайс-лист</h1>
    <nav><a href="../">Кабинет</a><a href="../price/" aria-current="page">Прайс-лист</a><a href="../windows/">Свободные окошки</a><a href="https://betep-rnd.github.io/lara-lashes/">Сертификаты</a></nav>
  </header>

  <div class="grid">
    <form class="panel" id="form" novalidate>
      <nav class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="content">Содержание</button>
        <button type="button" role="tab" data-tab="design">Дизайн</button>
        <button type="button" role="tab" data-tab="fonts">Шрифты</button>
      </nav>

      <!-- Содержание -->
      <div class="tab" data-tab="content">
        <section class="group">
          <h2>Шапка</h2>
          <div class="field">
            <label for="prof">Профессия</label>
            <select id="prof"></select>
          </div>
          <div class="row">
            <div class="field">
              <label for="title">Заголовок</label>
              <input id="title" type="text" maxlength="24">
            </div>
            <div class="field">
              <label for="subtitle">Подзаголовок</label>
              <input id="subtitle" type="text" maxlength="40">
            </div>
          </div>
        </section>

        <section class="group">
          <h2>Услуги</h2>
          <div class="svcs" id="svcs"></div>
          <button class="btn ghost" type="button" id="addBtn">+ Добавить услугу</button>
          <div class="addrow" id="addRow" hidden>
            <select id="addSel" aria-label="Выберите услугу"></select>
            <button class="btn ghost" type="button" id="addCancel">Отмена</button>
          </div>
          <div class="field">
            <label for="currency">Как писать цену</label>
            <select id="currency">
              <option value="руб.">3 000 руб.</option>
              <option value="₽">3 000 ₽</option>
            </select>
          </div>
        </section>

        <div id="contacts"></div>
      </div>

      <div class="tab" data-tab="design" id="design" hidden></div>
      <div class="tab" data-tab="fonts" id="fonts" hidden></div>

      <section class="group">
        <label class="check"><input type="checkbox" id="watermark"> Водяной знак «ОБРАЗЕЦ»</label>
        <div class="btnrow">
          <button class="btn" type="button" id="download">Скачать картинку</button>
          <button class="btn ghost" type="button" id="share" hidden>Отправить</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </section>
    </form>

    <div class="preview">
      <canvas id="cv" aria-label="Превью прайс-листа"></canvas>
      <span class="hint" id="size"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../kit/backgrounds.js?v=202610250111"></script>
<script src="../kit/kit.js?v=202610250111"></script>
<script>
// ---------- справочник услуг (Лэшмейкер — список Ларисы с ценами, остальное — по Яндекс Картам, без цен) ----------
const PROFS = [
  { id: "lash", name: "Лэшмейкер", subtitle: "Наращивание ресниц", services: [
    ["Уголки", "2100"], ["Наращивание нижних ресниц", "1000"], ["Объём 1D (классика)", "3000"], ["Объём 1,5D–2D", "3300"],
    ["Объём 2,5D–3D", "3600"], ["Объём 4D–5D", "4000"], ["Снятие ресниц без последующего наращивания", "500"],
    ["Ламинирование ресниц", ""], ["Окрашивание ресниц", ""], ["Ботокс ресниц", ""]] },
  { id: "brows", name: "Бровист", subtitle: "Оформление бровей", services: [
    ["Коррекция бровей", ""], ["Окрашивание бровей", ""], ["Окрашивание бровей хной", ""], ["Коррекция и окрашивание бровей", ""],
    ["Ламинирование бровей", ""], ["Мужские брови", ""]] },
  { id: "nails", name: "Мастер маникюра и педикюра", subtitle: "Маникюр и педикюр", services: [
    ["Маникюр без покрытия", ""], ["Маникюр с покрытием гель-лаком", ""], ["Мужской маникюр", ""], ["Детский маникюр", ""],
    ["Педикюр без покрытия", ""], ["Педикюр с покрытием гель-лаком", ""], ["Smart-педикюр", ""], ["Снятие покрытия", ""],
    ["Дизайн ногтей", ""], ["Наращивание ногтей", ""], ["Укрепление ногтей", ""], ["Парафинотерапия", ""], ["SPA-уход для рук", ""]] },
  { id: "hair", name: "Парикмахер-стилист", subtitle: "Стрижки и окрашивание", services: [
    ["Женская стрижка", ""], ["Мужская стрижка", ""], ["Детская стрижка", ""], ["Укладка", ""], ["Вечерняя / свадебная укладка", ""],
    ["Окрашивание в один тон", ""], ["Тонирование", ""], ["Мелирование", ""], ["Сложное окрашивание", ""],
    ["Кератиновое выпрямление", ""], ["Ботокс для волос", ""], ["Химическая завивка", ""], ["Уход для волос", ""]] },
  { id: "cosm", name: "Косметолог-эстетист", subtitle: "Уход за лицом", services: [
    ["Комбинированная чистка лица", ""], ["Ультразвуковая чистка лица", ""], ["Пилинг", ""], ["Карбоновый пилинг", ""],
    ["Массаж лица", ""], ["Уходовая процедура для лица", ""], ["Уход при акне", ""], ["RF-лифтинг", ""], ["Микротоки", ""]] },
  { id: "massage", name: "Массажист", subtitle: "Массаж", services: [
    ["Классический массаж спины", ""], ["Массаж воротниковой зоны", ""], ["Общий массаж", ""], ["Антицеллюлитный массаж", ""],
    ["Лимфодренажный массаж", ""], ["Массаж лица", ""], ["Массаж стоп", ""], ["Релакс-массаж", ""], ["Спортивный массаж", ""], ["Баночный массаж", ""]] },
  { id: "depil", name: "Мастер депиляции", subtitle: "Шугаринг и воск", services: [
    ["Подмышки", ""], ["Бикини классическое", ""], ["Бикини глубокое", ""], ["Ноги полностью", ""], ["Голени", ""],
    ["Руки до локтя", ""], ["Верхняя губа", ""], ["Комплекс: глубокое бикини + подмышки + ноги", ""]] },
  { id: "pm", name: "Мастер перманентного макияжа", subtitle: "Перманентный макияж", services: [
    ["Пудровые брови", ""], ["Перманент губ", ""], ["Межресничка", ""], ["Стрелка", ""], ["Коррекция перманента", ""], ["Удаление перманента ремувером", ""]] },
  { id: "barber", name: "Барбер", subtitle: "Мужские стрижки", services: [
    ["Мужская стрижка", ""], ["Стрижка машинкой", ""], ["Стрижка бороды", ""], ["Стрижка + борода", ""], ["Королевское бритьё", ""],
    ["Детская стрижка", ""], ["Камуфляж седины", ""]] },
];
const TEXTS = [
  { k: "title", name: "Заголовок" }, { k: "subtitle", name: "Подзаголовок" }, { k: "master", name: "Имя мастера" },
  { k: "services", name: "Услуги" }, { k: "prices", name: "Цены" }, { k: "contacts", name: "Контакты" },
];
const { W, SCALE, FORMATS, esc, group, fontOf, caseOf } = Kit;
const $ = id => document.getElementById(id);

// ---------- состояние ----------
const KEY = "price.v1";
let S = { theme: "lux-0", format: "story", prof: "lash", title: "Прайс-лист", subtitle: "Наращивание ресниц",
  currency: "руб.", services: PROFS[0].services.slice(0, 7).map(([name, price]) => ({ name, price })), watermark: true, text: {} };
const saved = Kit.loadJSON(KEY);
if (saved && Array.isArray(saved.services)) ["theme", "format", "prof", "title", "subtitle", "currency", "services", "watermark", "text"].forEach(k => { if (saved[k] != null) S[k] = saved[k]; });
if (!Kit.THEMES[S.theme]) S.theme = "lux-0";
const prof = Kit.loadProfile();
const th = () => Kit.THEMES[S.theme] || Kit.THEMES["lux-0"];
const base = (k, t) => k === "services" ? { font: "Montserrat", weight: 400, italic: false, caps: false, color: t.ink }
  : k === "prices" ? { font: "Montserrat", weight: 600, italic: false, caps: false, color: t.accent } : null;
const style = k => Kit.styleOf(S.text, k, th(), base);

function fmtPrice(raw) {
  const p = (raw || "").trim();
  if (!p) return "";
  if (/₽|руб/i.test(p) || !/\d/.test(p)) return p;
  return p.replace(/\d{4,}/g, group) + " " + S.currency;
}

// ---------- рисование ----------
const canvas = $("cv"), ctx = canvas.getContext("2d"), dr = Kit.painter(ctx);
let H = 1920;
function services(top, bottom, t, P) {
  const items = S.services.filter(s => s.name.trim() || s.price.trim());
  const cw = W - 2 * P, avail = bottom - top, sn = style("services"), sp = style("prices");
  if (!items.length) { dr.centered("Добавьте услуги кнопкой «+»", W / 2, (top + bottom) / 2, '400 30px "Montserrat"', t.muted); return; }
  let s, rows, lineH, gap, total;
  for (s = Math.min(80, 42 * sn.size); s >= 14; s -= 1) {      // подбираем кегль, чтобы список влез
    const ps = s * sp.size / sn.size;
    ctx.font = fontOf(sp, ps);
    const prices = items.map(it => caseOf(sp, fmtPrice(it.price)));
    const priceW = Math.max(0, ...prices.map(p => ctx.measureText(p).width));
    ctx.font = fontOf(sn, s);
    rows = items.map((it, i) => ({ lines: dr.wrap(caseOf(sn, it.name || "—"), cw - priceW - 44), price: prices[i] }));
    lineH = s * 1.32; gap = s * .9;
    total = rows.reduce((a, r) => a + r.lines.length * lineH, 0) + gap * (rows.length - 1);
    if (total <= avail) break;
  }
  const ps = s * sp.size / sn.size;
  let y = top + Math.max(0, (avail - total) * .45);
  rows.forEach(r => {
    ctx.font = fontOf(sn, s); ctx.fillStyle = dr.paint(sn.color, P, W - P); ctx.textAlign = "left";
    r.lines.forEach((ln, i) => ctx.fillText(ln, P, y + s + i * lineH));
    const baseY = y + s + (r.lines.length - 1) * lineH;
    if (r.price) {
      const endX = P + ctx.measureText(r.lines[r.lines.length - 1]).width + 14;
      ctx.font = fontOf(sp, ps);
      const pw = ctx.measureText(r.price).width, px = W - P - pw;
      ctx.fillStyle = t.dots;
      for (let x = endX + 4; x < px - 14; x += 13) { ctx.beginPath(); ctx.arc(x, baseY - s * .12, 1.8, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = dr.paint(sp.color, px, px + pw); ctx.fillText(r.price, px, baseY);
    }
    y += r.lines.length * lineH + gap;
  });
}
function draw() {
  const t = th(), F = FORMATS[S.format] || FORMATS.story;
  if (H !== F.h || canvas.width !== W * SCALE) { H = F.h; canvas.width = W * SCALE; canvas.height = H * SCALE; }
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  Kit.drawBg(ctx, t, W, H);
  const y = Kit.header(dr, t, F, { title: S.title, titleDefault: "Прайс-лист", subtitle: S.subtitle, master: prof.master }, style);
  const foot = Kit.footer(dr, t, F, prof, style), footTop = H - F.bottom - foot.h;
  services(y + 56, footTop - 64, t, 96);
  foot.draw(footTop);
  if (S.watermark) dr.watermark(t, H);
  $("size").textContent = `Картинка ${W * SCALE} × ${H * SCALE} — для сторис, мессенджеров и печати`;
}
let raf = 0;
function changed() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); Kit.store.set(KEY, JSON.stringify(S)); }

// ---------- панели ----------
const design = Kit.designPanel($("design"), S, kind => { if (kind === "theme") fonts.refresh(); changed(); });
const fonts = Kit.fontsPanel($("fonts"), TEXTS, S, style, changed);
const contacts = Kit.contactsPanel($("contacts"), prof, changed);
const tabs = Kit.tabs($("tabs"), "price.tab", name => { if (name === "design") design.show(); });

// услуги
function buildServices() {
  const n = S.services.length;
  $("svcs").innerHTML = n ? S.services.map((s, i) => `<div class="svc" data-i="${i}">
      <input type="text" class="name" value="${esc(s.name)}" placeholder="Название услуги" aria-label="Услуга">
      <input type="text" class="price" value="${esc(s.price)}" placeholder="цена" inputmode="numeric" aria-label="Цена">
      <span class="tools">
        <button type="button" class="icon" data-act="up" title="Выше" aria-label="Выше" ${i ? "" : "disabled"}>↑</button>
        <button type="button" class="icon" data-act="down" title="Ниже" aria-label="Ниже" ${i < n - 1 ? "" : "disabled"}>↓</button>
        <button type="button" class="icon del" data-act="del" title="Удалить услугу" aria-label="Удалить услугу">×</button>
      </span></div>`).join("")
    : `<div class="empty">Пока пусто — добавьте первую услугу.</div>`;
}
$("svcs").addEventListener("input", e => {
  const row = e.target.closest(".svc"); if (!row) return;
  S.services[row.dataset.i][e.target.classList.contains("name") ? "name" : "price"] = e.target.value; changed();
});
$("svcs").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const i = +b.closest(".svc").dataset.i, L = S.services;
  if (b.dataset.act === "del") L.splice(i, 1);
  if (b.dataset.act === "up" && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
  if (b.dataset.act === "down" && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
  buildServices(); changed();
});
function buildAddList() {                                       // текущая профессия сверху, уже добавленные не показываем
  const have = new Set(S.services.map(s => s.name.trim().toLowerCase()));
  const order = [...PROFS].sort((a, b) => (b.id === S.prof) - (a.id === S.prof));
  $("addSel").innerHTML = `<option value="">Выберите услугу…</option><option value="__custom">✎ Своя услуга — вписать вручную</option>` +
    order.map(p => {
      const opts = p.services.filter(([n]) => !have.has(n.toLowerCase()))
        .map(([n, pr]) => `<option value="${p.id}|${esc(n)}">${esc(n)}${pr ? " — " + group(pr) : ""}</option>`).join("");
      return opts ? `<optgroup label="${esc(p.name)}">${opts}</optgroup>` : "";
    }).join("");
}
function showAdd(on) { $("addRow").hidden = !on; $("addBtn").hidden = on; }
$("addBtn").addEventListener("click", () => {
  buildAddList(); showAdd(true); const sel = $("addSel"); sel.value = ""; sel.focus();
  if (sel.showPicker) try { sel.showPicker(); } catch (e) {}
});
$("addCancel").addEventListener("click", () => showAdd(false));
$("addSel").addEventListener("change", e => {
  const v = e.target.value; if (!v) return;
  if (v === "__custom") S.services.push({ name: "", price: "" });
  else {
    const [pid, name] = v.split("|"), p = PROFS.find(x => x.id === pid), svc = p.services.find(([n]) => n === name);
    S.services.push({ name, price: svc ? svc[1] : "" });
  }
  showAdd(false); buildServices(); changed();
  const rows = $("svcs").querySelectorAll(".svc"), last = rows[rows.length - 1];
  if (last) (v === "__custom" ? last.querySelector(".name") : last.querySelector(".price")).focus();
});

// шапка и прочее
$("prof").innerHTML = PROFS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
$("prof").addEventListener("change", e => {
  const old = PROFS.find(p => p.id === S.prof), now = PROFS.find(p => p.id === e.target.value);
  if (!S.subtitle.trim() || (old && S.subtitle === old.subtitle)) { S.subtitle = now.subtitle; $("subtitle").value = S.subtitle; }
  S.prof = now.id; changed();
});
["title", "subtitle"].forEach(id => $(id).addEventListener("input", e => { S[id] = e.target.value; changed(); }));
$("currency").addEventListener("change", e => { S.currency = e.target.value; changed(); });
$("watermark").addEventListener("change", e => { S.watermark = e.target.checked; changed(); });

// ---------- сохранить и отправить ----------
Kit.output({ download: $("download"), share: $("share"), status: $("status") }, canvas, draw,
  () => `Прайс_${Kit.safeName(prof.master)}.png`,
  () => {
    const err = Kit.profileError(prof) || (S.services.some(s => s.name.trim()) ? "" : "Добавьте хотя бы одну услугу.");
    if (err) { tabs.show("content"); contacts.focus(err.includes("имя") ? "master" : err.includes("телефон") ? "phone" : ""); }
    return err;
  });

// ---------- старт ----------
$("title").value = S.title; $("subtitle").value = S.subtitle;
$("prof").value = S.prof; $("currency").value = S.currency; $("watermark").checked = S.watermark;
buildServices(); tabs.show(tabs.current); changed();
Promise.all([...fonts.fontsInUse(), '600 84px "Cormorant Garamond"', '128px "Marck Script"', '600 30px "Montserrat"'].map(f => document.fonts.load(f, "Прайс-лист 0123456789")))
  .catch(() => {}).then(() => { changed(); if (tabs.current === "design") design.show(); });
</script>
</body>
</html>
